{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Add Review</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="member_id" class="form-label">Member *</label>
                <select class="form-select" id="member_id" name="member_id" required>
                    <option value="">-- Select a Member --</option>
                    {% for member in members %}
                    <option value="{{ member.member_id }}">{{ member.full_name() }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="book_id" class="form-label">Book *</label>
                <select class="form-select" id="book_id" name="book_id" required>
                    <option value="">-- Select a Book --</option>
                    {% for book in books %}
                    <option value="{{ book.book_id }}">{{ book.title }} — {{ book.author }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="rating" class="form-label">Rating (1–5) *</label>
                <select class="form-select" id="rating" name="rating" required>
                    <option value="">-- Select a Rating --</option>
                    <option value="5">★★★★★ (5)</option>
                    <option value="4">★★★★☆ (4)</option>
                    <option value="3">★★★☆☆ (3)</option>
                    <option value="2">★★☆☆☆ (2)</option>
                    <option value="1">★☆☆☆☆ (1)</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="review_text" class="form-label">Review</label>
                <textarea class="form-control" id="review_text" name="review_text"
                          rows="4" placeholder="Write your review here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Review</button>
            <a href="{{ url_for('reviews') }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
