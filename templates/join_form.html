{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Add Member to Club</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="member_id" class="form-label">Member *</label>
                <select class="form-select" id="member_id" name="member_id" required>
                    <option value="">-- Select a Member --</option>
                    {% for member in members %}
                    <option value="{{ member.member_id }}">{{ member.full_name() }} ({{ member.email }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="club_id" class="form-label">Club *</label>
                <select class="form-select" id="club_id" name="club_id" required>
                    <option value="">-- Select a Club --</option>
                    {% for club in clubs %}
                    <option value="{{ club.club_id }}">{{ club.club_name }} ({{ club.city if club.city else 'N/A' }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role">
                    <option value="member">Member</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Add to Club</button>
            <a href="{{ url_for('clubs') }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
